<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home Page</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body class="bg-white text-gray-900">
    <header
      class="sticky top-0 z-50 border-b border-gray-200 shadow-sm bg-white"
    >
      <nav
        class="mx-auto flex max-w-7xl flex-col gap-4 px-4 py-5 sm:flex-row sm:items-center sm:justify-between sm:px-6"
      >
        <a href="index.html" class="text-2xl font-bold text-violet-600">
          INNOVEX.
        </a>
        <div class="flex flex-col items-center gap-6 sm:flex-row">
          <a href="index.html" class="text-violet-700">Home</a>
          <a href="schedule.html" class="hover:text-violet-600">Schedule</a>
          <a href="speakers.html" class="hover:text-violet-600">Speakers</a>
          <a href="aboutus.html" class="hover:text-violet-600">About Us</a>
        </div>
        <div class="flex flex-col items-center gap-3 sm:flex-row">
          <a
            href="register.html"
            class="rounded-lg bg-violet-500 px-4 py-2 font-bold text-white hover:bg-violet-600"
            >Register</a
          >
        </div>
      </nav>
    </header>
                <!-- Hero_Section -->
    <section class="relative bg-[url('/images/hero_bg.jpeg')] bg-cover bg-center bg-no-repeat px-4 py-24 text-center">
     <div class="absolute inset-0 bg-black/20"></div>
     <div class="relative z-10">
        <p class="mb-4 font-semibold uppercase text-violet-600 bg-violet-200 border border-violet-200 px-4 py-2 rounded-full inline-block">
        Annual College Tech Fest 2026
      </p>
      <h1 class="mb-6 text-4xl font-extrabold text-white">
        Welcome to <span class="text-violet-300">INNOVEX 2026</span>
      </h1>
      <p class="text-white text-lg max-w-2xl mb-8 mx-auto">
        Join us for an exciting journey into the world of technology and
        innovation at INNOVEX 2026! 
      </p>

      <div class="flex gap-6  max-w-5xl mx-auto flex-row w-full">
        <div class="flex-1 rounded-xl border border-violet-100 bg-white px-4 py-10 shadow-sm ">
          <p class="mb-2 text-sm text-gray-600">
            <i class="fa-regular fa-calendar-days mr-2 text-violet-600"></i>
            Event Date
          </p>
          <p class="font-bold text-gray-900">12-13 December 2026</p>
        </div>

        <div class="flex-1 rounded-xl border border-violet-100 bg-white px-6 py-10 shadow-sm">
          <p class="mb-2 text-sm text-gray-600">
            <i class="fa-solid fa-location-dot mr-2 text-violet-700"></i>
            Venue
          </p>
          <p class="font-bold text-gray-900">Bhubaneswar, Odisha</p>
        </div>
      </div>

      <div
        class="mt-8 flex flex-col items-center justify-center gap-4 sm:flex-row"
      >
        <a
          href="register.html"
          class="w-full rounded-lg bg-violet-600 px-7 py-3 text-center font-semibold text-white shadow-sm transition hover:bg-violet-700 sm:w-auto"
        >
          <i class="fa-solid fa-user-plus mr-2"></i>
          Register Now
        </a>

        <a
          href="schedule.html"
          class="w-full rounded-lg border border-violet-600 bg-white px-7 py-3 text-center font-semibold text-violet-600 transition hover:bg-violet-50 sm:w-auto"
        >
          <i class="fa-regular fa-calendar mr-2"></i>
          Explore Schedule
        </a>
      </div>
     </div>
    </section>
  </body>
</html>
